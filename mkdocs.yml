site_name: Manual de Laboratório - GUI-TCC
site_description: Roteiros de experimentos práticos de Arquitetura de Computadores e Sistemas Embarcados
docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para modo claro
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo escuro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Introdução: index.md
  - Laboratórios:
      - "1. Processador RV32I Multiciclo": exp01_rv32i.md
      - "2. I/O Mapeado em Memória (GPIO/UART)": exp02_io.md
      - "3. Acesso Direto à Memória (DMA)": exp03_dma.md
      - "4. Console do Sistema Operacional Embarcado": exp04_os_console.md
      - "5. Micro-Arquitetura da NPU (Systolic Array)": exp05_npu.md
      - "6. Tiling e Escalonamento de Hardware": exp06_tiling.md
      - "7. Inferência de Rede Neural (MNIST)": exp07_nn.md
