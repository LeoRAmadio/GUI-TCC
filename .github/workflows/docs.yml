name: Roteiro (PDF) -> GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Mesmo TeX Live (apt) do ambiente de desenvolvimento (Ubuntu/Pop!_OS 24.04).
    # A Open Sans vem do pacote fonts-open-sans (TrueType): a versão Type 1 do
    # pacote TeX 'opensans' quebra o xdvipdfmx ("Error occurred while loading font").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instala TeX Live e fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-pictures texlive-plain-generic \
            texlive-lang-portuguese texlive-fonts-recommended \
            fonts-open-sans fonts-dejavu-core

      - name: Compila o roteiro (XeLaTeX)
        working-directory: docs
        run: latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode -outdir=../build/latex roteiro_experimentos.tex

      - name: Monta o site
        run: |
          mkdir -p build/pages
          cp build/latex/roteiro_experimentos.pdf build/pages/
          cat > build/pages/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Roteiro de Experimentos - GUI-TCC</title>
          <meta http-equiv="refresh" content="0; url=roteiro_experimentos.pdf">
          <a href="roteiro_experimentos.pdf">Abrir o roteiro (PDF)</a>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}roteiro_experimentos.pdf
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
