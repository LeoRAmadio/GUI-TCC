name: Release (Windows .exe)

# Publica uma release ao enviar uma tag de versão:
#   git tag v1.0.0 && git push origin v1.0.0
# Execução manual (workflow_dispatch) só gera o .zip como artifact da run, sem release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Baixa o GCC RISC-V (Lab 2)
        run: python tools/fetch_toolchain.py --platform win32-x64

      - name: Testa o GCC RISC-V com o firmware padrão do Lab 2
        shell: bash
        run: python tools/check_toolchain.py --require-bundled

      - name: Gera o executável (PyInstaller)
        run: pyinstaller GUI-TCC.spec --noconfirm --workpath build/pyinstaller --distpath dist

      - name: Teste de fumaça do executável (abre, carrega o torch e fecha)
        shell: pwsh
        run: |
          $exe = "dist/GUI-TCC/GUI-TCC.exe"
          $log = "dist/GUI-TCC/selftest.log"
          Get-Item dist/GUI-TCC/_internal/msvcp140.dll, dist/GUI-TCC/_internal/vcruntime140.dll |
            ForEach-Object { "$($_.Name) $($_.VersionInfo.FileVersion)" }
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
          $null = $p.Handle  # garante o ExitCode depois do WaitForExit
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "O executável não fechou em 180 s" }
          if (Test-Path $log) { Get-Content $log; Remove-Item $log } else { "selftest.log não foi gerado" }
          if ($p.ExitCode -ne 0) { throw "O teste de fumaça falhou (código $($p.ExitCode))" }

      - name: Empacota
        shell: pwsh
        run: Compress-Archive -Path dist/GUI-TCC -DestinationPath GUI-TCC-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GUI-TCC-windows-x64
          path: GUI-TCC-windows-x64.zip

      - name: Publica a release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" GUI-TCC-windows-x64.zip \
            --title "GUI-TCC $GITHUB_REF_NAME" --generate-notes
